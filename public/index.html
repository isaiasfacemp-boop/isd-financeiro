<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISD Financeiro</title>
<meta name="application-name" content="ISD Financeiro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ISD Financeiro">
<meta name="theme-color" content="#1A1F2E">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:#ECEEF2;--surface:#F4F5F8;--sidebar-bg:#1A1F2E;--sidebar-fg:#A8B0C4;
  --sidebar-active:#FFFFFF;--fg:#1A1F2E;--fg-muted:#6B7280;--border:#E5E8EF;
  --pagar:#E05252;--pagar-bg:#FEF2F2;--receber:#16A34A;--receber-bg:#F0FDF4;
  --saldo:#2563EB;--saldo-bg:#EFF6FF;--accent:#2563EB;--accent-hover:#1D4ED8;
  --shadow:0 1px 4px rgba(26,31,46,.08);--radius:10px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1117;--surface:#1A1F2E;--sidebar-bg:#0A0D14;--sidebar-fg:#6B7280;
  --fg:#F1F3F8;--fg-muted:#8B93A8;--border:#252B3B;--pagar:#F87171;--pagar-bg:#2D1515;
  --receber:#4ADE80;--receber-bg:#0F2D1A;--saldo:#60A5FA;--saldo-bg:#0F1E3D;
  --accent:#3B82F6;--accent-hover:#2563EB;--shadow:0 1px 4px rgba(0,0,0,.3);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1117;--surface:#1A1F2E;--sidebar-bg:#0A0D14;--sidebar-fg:#6B7280;
  --fg:#F1F3F8;--fg-muted:#8B93A8;--border:#252B3B;--pagar:#F87171;--pagar-bg:#2D1515;
  --receber:#4ADE80;--receber-bg:#0F2D1A;--saldo:#60A5FA;--saldo-bg:#0F1E3D;
  --accent:#3B82F6;--accent-hover:#2563EB;--shadow:0 1px 4px rgba(0,0,0,.3);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;min-height:100%;font-size:14px}

/* ─── LOGIN ─── */
#loginScreen{position:fixed;inset:0;background:var(--sidebar-bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:0}
.login-box{background:var(--surface);border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.login-box h2{font-size:22px;font-weight:700;color:var(--fg);margin-bottom:4px}
.login-box p{color:var(--fg-muted);font-size:13px;margin-bottom:28px}
.login-tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.login-tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg-muted);background:transparent;border:none;transition:.15s}
.login-tab.active{background:var(--accent);color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--fg-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit;outline:none}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn-login{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-login:hover{background:var(--accent-hover)}
.login-err{color:var(--pagar);font-size:13px;margin-top:12px;text-align:center;min-height:20px}

/* ─── LAYOUT ─── */
.sidebar{width:220px;flex-shrink:0;background:var(--sidebar-bg);display:flex;flex-direction:column;padding:24px 0;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:12px}
.sidebar-logo h1{font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.sidebar-logo span{font-size:11px;color:var(--sidebar-fg)}
.nav-section{padding:8px 12px 4px;font-size:10px;font-weight:700;color:#3B4560;letter-spacing:1px;text-transform:uppercase;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--sidebar-fg);font-size:13.5px;font-weight:500;transition:.15s;border-radius:0;margin:1px 8px;border-radius:8px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:var(--sidebar-active)}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.07);padding:16px 8px 0}
.user-info{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.user-info:hover{background:rgba(255,255,255,.06)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:12.5px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--sidebar-fg)}

.main{flex:1;margin-left:220px;display:flex;flex-direction:column;min-height:100vh;padding:28px 28px 28px;max-width:1200px}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;padding:16px}}

/* ─── HEADER / PERFIS ─── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700;color:var(--fg)}
.perfil-tabs{display:flex;gap:6px;flex-wrap:wrap}
.perfil-tab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;border:1.5px solid var(--border);background:var(--surface);color:var(--fg-muted);transition:.15s}
.perfil-tab.active,.perfil-tab:hover{border-color:var(--accent);color:var(--accent);background:var(--saldo-bg)}

/* ─── CARDS ─── */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.card-stat{background:var(--surface);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card-stat-label{font-size:12px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.card-stat-value{font-size:22px;font-weight:700}
.card-stat-sub{font-size:12px;color:var(--fg-muted);margin-top:4px}

/* ─── TABLE ─── */
.table-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.table-card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.table-card-title{font-size:15px;font-weight:600;color:var(--fg)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--fg)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(37,99,235,.03)}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-pagar{background:var(--pagar-bg);color:var(--pagar)}
.badge-receber{background:var(--receber-bg);color:var(--receber)}
.badge-pago{background:var(--receber-bg);color:var(--receber)}
.badge-pendente{background:#FEF3C7;color:#D97706}
.badge-vencido{background:var(--pagar-bg);color:var(--pagar)}

/* ─── BOTÕES ─── */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:.15s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--fg-muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);color:var(--fg)}
.btn-danger{background:var(--pagar-bg);color:var(--pagar);border:1px solid var(--pagar)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ─── FILTROS ─── */
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filtros select,.filtros input[type=month],.filtros input[type=text]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;font-family:inherit;outline:none}
.filtros select:focus,.filtros input:focus{border-color:var(--accent)}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.modal-header h3{font-size:17px;font-weight:700}
.modal-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 24px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.form-field label{display:block;font-size:11.5px;font-weight:600;color:var(--fg-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13.5px;font-family:inherit;outline:none}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}

/* ─── LOADING ─── */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--fg-muted);gap:10px;font-size:14px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TOAST ─── */
#toast{position:fixed;bottom:24px;right:24px;background:#1A1F2E;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:999;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#toast.show{opacity:1}

/* ─── EMPTY ─── */
.empty-state{text-align:center;padding:48px 20px;color:var(--fg-muted)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state p{font-size:14px}
</style>
</head>

<div id="toast"></div>

<script>
// ════════════════ API CLIENT ════════════════
const API_BASE = '';  // mesmo domínio
let _token = null;
let _empresa = null;
let _usuario = null;
let _perfis = [];
let _perfilAtivo = null;
let _contaTipo = 'pagar';

async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (_token) opts.headers['Authorization'] = 'Bearer ' + _token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + '/api/' + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erro na requisição');
  return data;
}

// ════════════════ LOGIN ════════════════
function setLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach((t,i) => t.classList.toggle('active', i===(tab==='entrar'?0:1)));
  document.getElementById('tabEntrar').hidden = tab !== 'entrar';
  document.getElementById('tabCadastrar').hidden = tab !== 'cadastrar';
  document.getElementById('loginErr').textContent = '';
}

async function doLogin() {
  const codigo = document.getElementById('loginCodigo').value.trim();
  const login  = document.getElementById('loginUser').value.trim();
  const senha  = document.getElementById('loginSenha').value;
  if (!codigo || !login || !senha) { showLoginErr('Preencha todos os campos'); return; }
  try {
    const res = await api('POST', 'auth/login', { empresa_codigo: codigo, login, senha });
    iniciarSessao(res);
  } catch(e) { showLoginErr(e.message); }
}

async function doRegister() {
  const empresa_nome   = document.getElementById('regEmpresa').value.trim();
  const empresa_codigo = document.getElementById('regCodigo').value.trim();
  const admin_nome     = document.getElementById('regNome').value.trim();
  const admin_login    = document.getElementById('regLogin').value.trim();
  const admin_senha    = document.getElementById('regSenha').value;
  if (!empresa_nome || !empresa_codigo || !admin_login || !admin_senha)
    { showLoginErr('Preencha todos os campos'); return; }
  try {
    const res = await api('POST', 'auth/register', { empresa_nome, empresa_codigo, admin_nome, admin_login, admin_senha });
    iniciarSessao(res);
  } catch(e) { showLoginErr(e.message); }
}

function showLoginErr(msg) {
  document.getElementById('loginErr').textContent = msg;
}

function iniciarSessao(res) {
  _token   = res.token;
  _empresa = res.empresa;
  _usuario = res.usuario || { nome: 'Administrador', login: 'ADMIN', isAdmin: true };
  try { sessionStorage.setItem('fc_session', JSON.stringify({ token: _token, empresa: _empresa, usuario: _usuario })); } catch(e) {}

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').hidden = false;
  document.getElementById('app').style.display = '';

  document.getElementById('sideNomeEmpresa').textContent = _empresa.nome;
  document.getElementById('sideCodigoEmpresa').textContent = _empresa.codigo;
  document.getElementById('sideUserName').textContent = _usuario.nome;
  document.getElementById('sideAvatar').textContent = (_usuario.nome||'A')[0].toUpperCase();

  const hoje = new Date();
  const mesStr = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0');
  document.getElementById('dashMes').value = mesStr;
  document.getElementById('pagarMes').value = mesStr;
  document.getElementById('receberMes').value = mesStr;

  loadPerfis().then(() => navTo('dashboard'));
}

function doLogout() {
  _token = null; _empresa = null; _usuario = null; _perfis = [];
  try { sessionStorage.removeItem('fc_session'); } catch(e) {}
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('app').hidden = true;
  document.getElementById('loginSenha').value = '';
  document.getElementById('loginErr').textContent = '';
}

// ════════════════ NAVEGAÇÃO ════════════════
function navTo(sec) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.sec === sec));
  document.querySelectorAll('main section').forEach(el => el.hidden = el.id !== 'sec-'+sec);
  if (sec === 'dashboard') loadDashboard();
  else if (sec === 'pagar')    { _contaTipo='pagar';    loadContas('pagar'); }
  else if (sec === 'receber')  { _contaTipo='receber';  loadContas('receber'); }
  else if (sec === 'clientes') loadClientes();
  else if (sec === 'perfis')   renderPerfis();
}

// ════════════════ PERFIS ════════════════
async function loadPerfis() {
  _perfis = await api('GET', 'perfis');
  if (!_perfilAtivo && _perfis.length) _perfilAtivo = _perfis[0].id;
  renderPerfisTabs();
}

function renderPerfisTabs() {
  const ids = ['dashPerfis','perfisTabsPagar','perfisTabsReceber','perfisTabsClientes'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = [
      `<div class="perfil-tab${!_perfilAtivo ? ' active' : ''}" onclick="setPerfil(null,'${id}')">Todos</div>`,
      ..._perfis.map(p => `<div class="perfil-tab${_perfilAtivo===p.id?' active':''}" onclick="setPerfil('${p.id}','${id}')">${p.icone||'🏢'} ${p.nome}</div>`)
    ].join('');
  });
}

function setPerfil(id, tabEl) {
  _perfilAtivo = id;
  renderPerfisTabs();
  const sec = document.querySelector('section:not([hidden])')?.id?.replace('sec-','');
  if (sec === 'dashboard') loadDashboard();
  else if (sec === 'pagar' || sec === 'receber') loadContas(sec === 'pagar' ? 'pagar' : 'receber');
  else if (sec === 'clientes') loadClientes();
}

function renderPerfis() {
  const el = document.getElementById('listaPerfis');
  if (!_perfis.length) {
    el.innerHTML = '<div class="empty-state"><p>Nenhum perfil cadastrado</p></div>';
    return;
  }
  el.innerHTML = `<div class="table-card"><table>
    <thead><tr><th>Ícone</th><th>Nome</th><th>Cor</th><th></th></tr></thead>
    <tbody>${_perfis.map(p => `<tr>
      <td style="font-size:20px">${p.icone||'🏢'}</td>
      <td><strong>${esc(p.nome)}</strong></td>
      <td><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${p.cor||'#2563EB'};vertical-align:middle"></span> ${p.cor||''}</td>
      <td style="text-align:right">
        <button class="btn btn-ghost btn-sm" onclick="editarPerfil('${p.id}')">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="excluirPerfil('${p.id}')">Excluir</button>
      </td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function abrirModalPerfil(p) {
  document.getElementById('perfilId').value = p?.id || '';
  document.getElementById('perfilNome').value = p?.nome || '';
  document.getElementById('perfilIcone').value = p?.icone || '🏢';
  document.getElementById('perfilCor').value = p?.cor || '#2563EB';
  document.getElementById('modalPerfilTitulo').textContent = p ? 'Editar Perfil' : 'Novo Perfil';
  abrirModal('modalPerfil');
}
function editarPerfil(id) { abrirModalPerfil(_perfis.find(p=>p.id===id)); }

async function salvarPerfil() {
  const id    = document.getElementById('perfilId').value;
  const nome  = document.getElementById('perfilNome').value.trim();
  const icone = document.getElementById('perfilIcone').value || '🏢';
  const cor   = document.getElementById('perfilCor').value;
  if (!nome) { toast('Informe o nome do perfil'); return; }
  try {
    if (id) await api('PUT', 'perfis/'+id, { nome, icone, cor, ordem: 0 });
    else    await api('POST', 'perfis', { nome, icone, cor, ordem: 0 });
    fecharModal('modalPerfil');
    await loadPerfis();
    renderPerfis();
    toast('Perfil salvo!');
  } catch(e) { toast(e.message, true); }
}

async function excluirPerfil(id) {
  if (!confirm('Excluir este perfil?')) return;
  await api('DELETE', 'perfis/'+id);
  await loadPerfis();
  renderPerfis();
  toast('Perfil excluído');
}

// ════════════════ DASHBOARD ════════════════
async function loadDashboard() {
  document.getElementById('dashCards').innerHTML = '<div class="loading"><div class="spinner"></div> Carregando...</div>';
  const mes = document.getElementById('dashMes').value;
  const [ano, m] = mes.split('-');
  const q = `dashboard?ano=${ano}&mes=${m}` + (_perfilAtivo ? `&perfil_id=${_perfilAtivo}` : '');
  try {
    const s = await api('GET', q);
    const pagar    = s.total_pagar    || 0;
    const receber  = s.total_receber  || 0;
    const pago     = s.pago           || 0;
    const recebido = s.recebido       || 0;
    const saldo    = recebido - pago;

    document.getElementById('dashCards').innerHTML = `
      <div class="card-stat">
        <div class="card-stat-label" style="color:var(--pagar)">A Pagar</div>
        <div class="card-stat-value" style="color:var(--pagar)">${fmt(pagar)}</div>
        <div class="card-stat-sub">Pago: ${fmt(pago)}</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-label" style="color:var(--receber)">A Receber</div>
        <div class="card-stat-value" style="color:var(--receber)">${fmt(receber)}</div>
        <div class="card-stat-sub">Recebido: ${fmt(recebido)}</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-label" style="color:var(--saldo)">Saldo</div>
        <div class="card-stat-value" style="color:${saldo>=0?'var(--receber)':'var(--pagar)'}">${fmt(saldo)}</div>
        <div class="card-stat-sub">Recebido − Pago</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-label">Total lançamentos</div>
        <div class="card-stat-value">${s.total||0}</div>
        <div class="card-stat-sub">no período</div>
      </div>
    `;

    // Próximos vencimentos
    const vencQ = `contas?status=pendente` + (_perfilAtivo ? `&perfil_id=${_perfilAtivo}` : '');
    const contas = await api('GET', vencQ);
    const hoje   = new Date().toISOString().slice(0,10);
    const prox   = contas.filter(c => c.vencimento >= hoje).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).slice(0,10);
    const venc   = contas.filter(c => c.vencimento < hoje);

    const rows = prox.length ? prox.map(c => `<tr>
      <td>${formatDate(c.vencimento)}</td>
      <td>${esc(c.descricao)}</td>
      <td><span class="badge badge-${c.tipo}">${c.tipo==='pagar'?'Pagar':'Receber'}</span></td>
      <td style="font-weight:600;color:${c.tipo==='pagar'?'var(--pagar)':'var(--receber)'}">${fmt(c.valor)}</td>
    </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--fg-muted);padding:32px">Nenhum vencimento próximo</td></tr>';

    document.getElementById('dashVencimentos').innerHTML = `
      ${venc.length ? `<div style="padding:10px 20px;background:var(--pagar-bg);color:var(--pagar);font-size:13px;font-weight:600">⚠️ ${venc.length} conta(s) vencida(s)</div>` : ''}
      <div class="table-wrap"><table>
        <thead><tr><th>Vencimento</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  } catch(e) {
    document.getElementById('dashCards').innerHTML = `<div class="loading" style="color:var(--pagar)">${e.message}</div>`;
  }
}

// ════════════════ CONTAS ════════════════
async function loadContas(tipo) {
  const tabela = document.getElementById(tipo === 'pagar' ? 'tabelaPagar' : 'tabelaReceber');
  tabela.innerHTML = '<div class="loading"><div class="spinner"></div> Carregando...</div>';

  const mes = document.getElementById(tipo+'Mes').value;
  const st  = document.getElementById(tipo+'Status').value;
  const [ano, m] = mes.split('-');

  let q = `contas?tipo=${tipo}&ano=${ano}&mes=${m}`;
  if (st) q += `&status=${st}`;
  if (_perfilAtivo) q += `&perfil_id=${_perfilAtivo}`;

  try {
    const contas = await api('GET', q);
    const hoje   = new Date().toISOString().slice(0,10);

    if (!contas.length) {
      tabela.innerHTML = '<div class="empty-state"><p>Nenhuma conta encontrada</p></div>';
      return;
    }

    const total = contas.reduce((s,c) => s + c.valor, 0);
    const totalPg = contas.filter(c=>c.status==='pago'||c.status==='recebido').reduce((s,c)=>s+c.valor,0);

    tabela.innerHTML = `<div class="table-card">
      <div class="table-card-header">
        <div class="table-card-title">${contas.length} lançamento(s)</div>
        <div style="font-size:13px;color:var(--fg-muted)">Total: <strong style="color:${tipo==='pagar'?'var(--pagar)':'var(--receber)'}">${fmt(total)}</strong> | Liquidado: <strong>${fmt(totalPg)}</strong></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Vencimento</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Status</th><th></th></tr></thead>
        <tbody>${contas.map(c => {
          const vencido = c.status === 'pendente' && c.vencimento < hoje;
          const st = vencido ? 'vencido' : c.status;
          const stLabel = { pendente:'Pendente', pago:'Pago', recebido:'Recebido', vencido:'Vencido' }[st] || st;
          return `<tr>
            <td>${formatDate(c.vencimento)}</td>
            <td>${esc(c.descricao)}</td>
            <td><small style="color:var(--fg-muted)">${esc(c.categoria||'—')}</small></td>
            <td style="font-weight:600;color:${tipo==='pagar'?'var(--pagar)':'var(--receber)'}">${fmt(c.valor)}</td>
            <td><span class="badge badge-${st}">${stLabel}</span></td>
            <td style="text-align:right">
              ${c.status==='pendente'?`<button class="btn btn-ghost btn-sm" onclick="marcarPago('${c.id}','${tipo}')">${tipo==='pagar'?'Pagar':'Receber'}</button>`:''}
              <button class="btn btn-ghost btn-sm" onclick="editarConta('${c.id}','${tipo}')">✏</button>
              <button class="btn btn-ghost btn-sm" style="color:var(--pagar)" onclick="excluirConta('${c.id}','${tipo}')">✕</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  } catch(e) {
    tabela.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`;
  }
}

let _contasCache = {};

async function abrirModal(tipo, id) {
  _contaTipo = tipo;
  popularSelectPerfis('contaPerfil');
  document.getElementById('contaId').value = id || '';
  document.getElementById('contaStatus').value = 'pendente';
  document.getElementById('contaValor').value = '';
  document.getElementById('contaDesc').value = '';
  document.getElementById('contaObs').value = '';
  document.getElementById('contaCategoria').value = '';
  document.getElementById('contaVenc').value = new Date().toISOString().slice(0,10);

  const statSel = document.getElementById('contaStatus');
  statSel.innerHTML = tipo === 'pagar'
    ? '<option value="pendente">Pendente</option><option value="pago">Pago</option>'
    : '<option value="pendente">Pendente</option><option value="recebido">Recebido</option>';

  if (id) {
    document.getElementById('modalContaTitulo').textContent = 'Editar Conta';
    try {
      const contas = await api('GET', 'contas?tipo='+tipo);
      const c = contas.find(x=>x.id===id);
      if (c) {
        document.getElementById('contaDesc').value = c.descricao;
        document.getElementById('contaValor').value = c.valor;
        document.getElementById('contaVenc').value = c.vencimento || '';
        document.getElementById('contaCategoria').value = c.categoria || '';
        document.getElementById('contaStatus').value = c.status;
        document.getElementById('contaObs').value = c.obs || '';
        document.getElementById('contaPerfil').value = c.perfil_id;
      }
    } catch(e) {}
  } else {
    document.getElementById('modalContaTitulo').textContent = tipo === 'pagar' ? 'Nova Conta a Pagar' : 'Nova Conta a Receber';
  }
  abrirModal_('modalConta');
}

async function salvarConta() {
  const id       = document.getElementById('contaId').value;
  const perfil_id = document.getElementById('contaPerfil').value;
  const descricao = document.getElementById('contaDesc').value.trim();
  const valor    = parseFloat(document.getElementById('contaValor').value);
  const vencimento = document.getElementById('contaVenc').value;
  const categoria = document.getElementById('contaCategoria').value.trim();
  const status   = document.getElementById('contaStatus').value;
  const obs      = document.getElementById('contaObs').value.trim();

  if (!descricao || !valor || !vencimento) { toast('Preencha descrição, valor e vencimento'); return; }

  const data = { perfil_id, descricao, valor, vencimento, tipo: _contaTipo, categoria, status, obs };
  try {
    if (id) await api('PUT', 'contas/'+id, data);
    else    await api('POST', 'contas', data);
    fecharModal('modalConta');
    loadContas(_contaTipo);
    toast('Conta salva!');
  } catch(e) { toast(e.message, true); }
}

async function marcarPago(id, tipo) {
  const st = tipo === 'pagar' ? 'pago' : 'recebido';
  try {
    const contas = await api('GET', 'contas?tipo='+tipo);
    const c = contas.find(x=>x.id===id);
    if (!c) return;
    await api('PUT', 'contas/'+id, { ...c, descricao: c.descricao, status: st });
    loadContas(tipo);
    toast(tipo === 'pagar' ? 'Marcado como pago!' : 'Marcado como recebido!');
  } catch(e) { toast(e.message, true); }
}

async function editarConta(id, tipo) { abrirModal(tipo, id); }

async function excluirConta(id, tipo) {
  if (!confirm('Excluir esta conta?')) return;
  await api('DELETE', 'contas/'+id);
  loadContas(tipo);
  toast('Conta excluída');
}

// ════════════════ CLIENTES ════════════════
async function loadClientes() {
  const el = document.getElementById('tabelaClientes');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const q = 'clientes' + (_perfilAtivo ? `?perfil_id=${_perfilAtivo}` : '');
  try {
    const clientes = await api('GET', q);
    if (!clientes.length) { el.innerHTML = '<div class="empty-state"><p>Nenhum cliente</p></div>'; return; }
    el.innerHTML = `<div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>CPF/CNPJ</th><th></th></tr></thead>
      <tbody>${clientes.map(c=>`<tr>
        <td><strong>${esc(c.nome)}</strong></td>
        <td>${esc(c.email||'—')}</td>
        <td>${esc(c.telefone||'—')}</td>
        <td>${esc(c.doc||'—')}</td>
        <td style="text-align:right">
          <button class="btn btn-ghost btn-sm" onclick="editarCliente('${c.id}')">✏</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--pagar)" onclick="excluirCliente('${c.id}')">✕</button>
        </td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  } catch(e) { el.innerHTML = `<div class="empty-state"><p>${e.message}</p></div>`; }
}

function abrirModalCliente(c) {
  popularSelectPerfis('clientePerfil');
  document.getElementById('clienteId').value = c?.id || '';
  document.getElementById('clienteNome').value = c?.nome || '';
  document.getElementById('clienteEmail').value = c?.email || '';
  document.getElementById('clienteTel').value = c?.telefone || '';
  document.getElementById('clienteDoc').value = c?.doc || '';
  document.getElementById('clienteObs').value = c?.obs || '';
  document.getElementById('modalClienteTitulo').textContent = c ? 'Editar Cliente' : 'Novo Cliente';
  abrirModal_('modalCliente');
}

async function editarCliente(id) {
  const cli = await api('GET', 'clientes');
  abrirModalCliente(cli.find(c=>c.id===id));
}

async function salvarCliente() {
  const id        = document.getElementById('clienteId').value;
  const perfil_id = document.getElementById('clientePerfil').value;
  const nome      = document.getElementById('clienteNome').value.trim();
  const email     = document.getElementById('clienteEmail').value.trim();
  const telefone  = document.getElementById('clienteTel').value.trim();
  const doc       = document.getElementById('clienteDoc').value.trim();
  const obs       = document.getElementById('clienteObs').value.trim();
  if (!nome) { toast('Informe o nome'); return; }
  try {
    if (id) await api('PUT', 'clientes/'+id, { nome, email, telefone, doc, obs });
    else    await api('POST', 'clientes', { perfil_id, nome, email, telefone, doc, obs });
    fecharModal('modalCliente');
    loadClientes();
    toast('Cliente salvo!');
  } catch(e) { toast(e.message, true); }
}

async function excluirCliente(id) {
  if (!confirm('Excluir este cliente?')) return;
  await api('DELETE', 'clientes/'+id);
  loadClientes();
  toast('Cliente excluído');
}

// ════════════════ UTILS ════════════════
function popularSelectPerfis(selId) {
  const sel = document.getElementById(selId);
  if (!sel) return;
  sel.innerHTML = _perfis.map(p => `<option value="${p.id}">${p.icone||''} ${p.nome}</option>`).join('');
  if (_perfilAtivo) sel.value = _perfilAtivo;
}

function abrirModal_(id) {
  const m = document.getElementById(id);
  m.hidden = false;
  m.style.display = 'flex';
}
function fecharModal(id) {
  const m = document.getElementById(id);
  m.hidden = true;
  m.style.display = 'none';
}
// Alias para uso nos onclick dos botões "Nova Conta"
function abrirModal(tipo) {
  if (tipo === 'pagar' || tipo === 'receber') {
    _contaTipo = tipo;
    popularSelectPerfis('contaPerfil');
    document.getElementById('contaId').value = '';
    document.getElementById('contaValor').value = '';
    document.getElementById('contaDesc').value = '';
    document.getElementById('contaObs').value = '';
    document.getElementById('contaCategoria').value = '';
    document.getElementById('contaVenc').value = new Date().toISOString().slice(0,10);
    const statSel = document.getElementById('contaStatus');
    statSel.innerHTML = tipo === 'pagar'
      ? '<option value="pendente">Pendente</option><option value="pago">Pago</option>'
      : '<option value="pendente">Pendente</option><option value="recebido">Recebido</option>';
    document.getElementById('modalContaTitulo').textContent = tipo === 'pagar' ? 'Nova Conta a Pagar' : 'Nova Conta a Receber';
    abrirModal_('modalConta');
  } else {
    abrirModal_(tipo);
  }
}

function fmt(v) {
  return 'R$ ' + (v||0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(d) {
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#991B1B' : '#1A1F2E';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Restaurar sessão ao recarregar
try {
  const saved = JSON.parse(sessionStorage.getItem('fc_session') || 'null');
  if (saved?.token) iniciarSessao(saved);
} catch(e) {}
</script>
